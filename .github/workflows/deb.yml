name: Build iOS Debs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Makefile
      - backend-swift/**
      - frontend/**
      - release/manifest.json
      - scripts/release-manifest.mjs
      - .github/workflows/deb.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Makefile
      - backend-swift/**
      - frontend/**
      - release/manifest.json
      - scripts/release-manifest.mjs
      - .github/workflows/deb.yml

env:
  THEOS: ${{ github.workspace }}/theos
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  prepare:
    name: Resolve release manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      unfair_repository: ${{ steps.manifest.outputs.unfair_repository }}
      unfair_ref: ${{ steps.manifest.outputs.unfair_ref }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate and export release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs validate
          echo "matrix=$(node scripts/release-manifest.mjs matrix)" >> "$GITHUB_OUTPUT"
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const manifest = require('./release/manifest.json')
          console.log(`unfair_repository=${manifest.dependencies.unfair.repository}`)
          console.log(`unfair_ref=${manifest.dependencies.unfair.ref}`)
          NODE

  build:
    name: Build ${{ matrix.variant }} deb
    needs: prepare
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout AssppJailbroken
        uses: actions/checkout@v6
        with:
          path: AssppJailbroken

      - name: Checkout UnfairKit dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.prepare.outputs.unfair_repository }}
          ref: ${{ needs.prepare.outputs.unfair_ref }}
          path: unfair

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AssppJailbroken/frontend/package-lock.json

      - name: Validate unified release version
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-manifest.mjs validate
          expected="$(node scripts/release-manifest.mjs version)"
          # The manifest CLI emits shell assignments (not exported variables).
          # Enable allexport so the same values are available to subsequent
          # commands in this validation step and to Make.
          set -a
          source <(node scripts/release-manifest.mjs env "${{ matrix.variant }}")
          set +a
          actual="$(awk '/^Version:/ { print $2; exit }' "backend-swift/packaging/control.${{ matrix.variant }}")"
          test "$expected" = "$actual"
          test "$RELEASE_VERSION" = "$expected"
          test "$DEVICE_PROFILE" = "${{ matrix.profile }}"
          test "$DEB_ARCHITECTURE" = "${{ matrix.deb_arch }}"
          test "$MACH_O_ARCH" = "${{ matrix.mach_o_arch }}"
          test "$MIN_IOS" = "${{ matrix.min_ios }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$expected" || {
              echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
              exit 1
            }
          fi

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then xcode_path="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache Theos
        uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ hashFiles('AssppJailbroken/.github/workflows/deb.yml') }}
          restore-keys: theos-${{ runner.os }}-

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
          brew list ldid >/dev/null 2>&1 || brew install ldid
          if [[ ! -f "$THEOS/makefiles/common.mk" ]]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          mkdir -p "$THEOS/bin"
          ln -sf "$(command -v ldid)" "$THEOS/bin/ldid"

      - name: Verify bundled Taurine runtime assets
        if: matrix.profile == 'taurine'
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          runner="$PWD/${{ matrix.runtime_runner }}"
          dumper="$PWD/${{ matrix.runtime_dumper }}"
          test -x "$runner"
          test -f "$dumper"
          xcrun lipo -info "$runner" | tee /dev/stderr | grep -Eq '(^|[^[:alnum:]_])${{ matrix.mach_o_arch }}([^[:alnum:]_]|$)'
          xcrun lipo -info "$dumper" | tee /dev/stderr | grep -Eq '(^|[^[:alnum:]_])${{ matrix.mach_o_arch }}([^[:alnum:]_]|$)'
          echo "TAURINE_RUNTIME_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "TAURINE_RUNTIME_DUMPER=$dumper" >> "$GITHUB_ENV"

      - name: Build profile package
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/release-manifest.mjs version)"
          mkdir -p backend-swift/debs
          find backend-swift/debs -maxdepth 1 -type f -name "wiki.qaq.unfaird_${version}_*" -delete
          make -C backend-swift package \
            FINALPACKAGE=1 \
            THEOS="$THEOS" \
            ASSPPWEB_DIR=.. \
            DEVICE_PROFILE="${{ matrix.profile }}" \
            DEVICE_VARIANT="${{ matrix.variant }}" \
            TAURINE_RUNTIME_RUNNER="${TAURINE_RUNTIME_RUNNER:-}" \
            TAURINE_RUNTIME_DUMPER="${TAURINE_RUNTIME_DUMPER:-}"

      - name: Audit and rename package
        id: deb
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/release-manifest.mjs version)"
          source_deb="$(find backend-swift/debs -maxdepth 1 -type f -name "wiki.qaq.unfaird_${version}_*.deb" -print | head -n 1)"
          test -f "$source_deb"
          mkdir -p release
          output="release/wiki.qaq.unfaird_${version}_${{ matrix.variant }}_${{ matrix.deb_arch }}.deb"
          cp "$source_deb" "$output"
          test "$(dpkg-deb -f "$output" Version)" = "$version"
          test "$(dpkg-deb -f "$output" Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb -f "$output" Name Description

          source <(node scripts/release-manifest.mjs env "${{ matrix.variant }}")
          audit_root="$(mktemp -d)"
          trap 'rm -rf "$audit_root"' EXIT
          dpkg-deb -x "$output" "$audit_root"
          daemon="$(find "$audit_root" -type f -path '*/usr/local/lib/unfaird/UnfairDaemon' -print -quit)"
          test -n "$daemon"

          assert_architecture() {
            local binary="$1"
            local label="$2"
            local architecture_info
            architecture_info="$(xcrun lipo -info "$binary")"
            echo "$label: $architecture_info"
            grep -Eq "(^|[^[:alnum:]_])${MACH_O_ARCH}([^[:alnum:]_]|$)" <<< "$architecture_info"
          }

          assert_architecture "$daemon" UnfairDaemon
          build_info="$(xcrun vtool -show-build "$daemon" 2>/dev/null || true)"
          actual_min_ios="$(awk '$1 == "minos" { print $2; exit }' <<< "$build_info")"
          if [[ -z "$actual_min_ios" ]]; then
            load_commands="$(xcrun otool -l "$daemon")"
            actual_min_ios="$(awk '/cmd LC_VERSION_MIN_IPHONEOS/ { found=1; next } found && $1 == "version" { print $2; exit }' <<< "$load_commands")"
          fi
          test -n "$actual_min_ios"
          IFS=. read -r actual_major actual_minor _ <<< "$actual_min_ios"
          actual_min_ios="${actual_major}.${actual_minor:-0}"
          echo "UnfairDaemon minimum iOS: $actual_min_ios"
          test "$actual_min_ios" = "$MIN_IOS"

          if [[ "${{ matrix.profile }}" == taurine ]]; then
            dpkg-deb --contents "$output" > release/deb-contents.txt
            grep -q 'UnfairRuntimeRunner' release/deb-contents.txt
            grep -q 'UnfairRuntimeDumper.dylib' release/deb-contents.txt
            runtime_runner="$(find "$audit_root" -type f -path '*/usr/local/lib/unfaird/UnfairRuntimeRunner' -print -quit)"
            runtime_dumper="$(find "$audit_root" -type f -path '*/usr/local/lib/unfaird/UnfairRuntimeDumper.dylib' -print -quit)"
            test -n "$runtime_runner"
            test -n "$runtime_dumper"
            assert_architecture "$runtime_runner" UnfairRuntimeRunner
            assert_architecture "$runtime_dumper" UnfairRuntimeDumper.dylib
          fi
          shasum -a 256 "$output" > "${output}.sha256"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "name=unfaird-${{ matrix.variant }}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.deb.outputs.name }}
          path: |
            AssppJailbroken/${{ steps.deb.outputs.path }}
            AssppJailbroken/${{ steps.deb.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish three device debs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate release manifest
        run: node scripts/release-manifest.mjs validate

      - uses: actions/download-artifact@v6
        with:
          pattern: unfaird-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload unified device release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" || \
              gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
