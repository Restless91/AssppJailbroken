name: Build iOS Debs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Makefile
      - backend-swift/**
      - frontend/**
      - .github/workflows/deb.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Makefile
      - backend-swift/**
      - frontend/**
      - .github/workflows/deb.yml

env:
  THEOS: ${{ github.workspace }}/theos
  UNFAIR_REPOSITORY: lbr77/unfair
  UNFAIR_REF: main
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: Build ${{ matrix.variant }} deb
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: iphone8
            profile: rootless
            architecture: iphoneos-arm64
          - variant: iphone11
            profile: taurine
            architecture: iphoneos-arm
          - variant: iphone15
            profile: rootless
            architecture: iphoneos-arm64

    steps:
      - name: Checkout AssppJailbroken
        uses: actions/checkout@v6
        with:
          path: AssppJailbroken

      - name: Checkout UnfairKit dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UNFAIR_REPOSITORY }}
          ref: ${{ env.UNFAIR_REF }}
          path: unfair

      - name: Validate unified release version
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '/^Version:/ { print $2; exit }' backend-swift/control)"
          actual="$(awk '/^Version:/ { print $2; exit }' "backend-swift/packaging/control.${{ matrix.variant }}")"
          test "$expected" = "$actual"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$expected" || {
              echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
              exit 1
            }
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AssppJailbroken/frontend/package-lock.json

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then xcode_path="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache Theos
        uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ hashFiles('AssppJailbroken/.github/workflows/deb.yml') }}
          restore-keys: theos-${{ runner.os }}-

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
          brew list ldid >/dev/null 2>&1 || brew install ldid
          if [[ ! -f "$THEOS/makefiles/common.mk" ]]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          mkdir -p "$THEOS/bin"
          ln -sf "$(command -v ldid)" "$THEOS/bin/ldid"

      - name: Verify bundled Taurine runtime assets
        if: matrix.profile == 'taurine'
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          runner="$PWD/backend-swift/vendor/taurine/bootstrap/UnfairRuntimeRunner"
          dumper="$PWD/backend-swift/vendor/taurine/bootstrap/UnfairRuntimeDumper.dylib"
          echo 'd701ee770f9a1304838f8ab02c15aea6b05f290a6d1d48dbaa3ece616317c5ea' " $runner" | shasum -a 256 -c -
          echo 'db647eefb4e49f9729b36ebedf8adf2e74ffda0cc0d944ade5a00c4c943bc8b3' " $dumper" | shasum -a 256 -c -
          file "$runner" | grep -q 'arm64'
          file "$dumper" | grep -q 'arm64'
          echo "TAURINE_RUNTIME_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "TAURINE_RUNTIME_DUMPER=$dumper" >> "$GITHUB_ENV"

      - name: Build profile package
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2; exit }' "backend-swift/packaging/control.${{ matrix.variant }}")"
          mkdir -p backend-swift/debs
          find backend-swift/debs -maxdepth 1 -type f -name "wiki.qaq.unfaird_${version}_*" -delete
          make -C backend-swift package \
            FINALPACKAGE=1 \
            THEOS="$THEOS" \
            ASSPPWEB_DIR=.. \
            DEVICE_PROFILE="${{ matrix.profile }}" \
            DEVICE_VARIANT="${{ matrix.variant }}" \
            TAURINE_RUNTIME_RUNNER="${TAURINE_RUNTIME_RUNNER:-}" \
            TAURINE_RUNTIME_DUMPER="${TAURINE_RUNTIME_DUMPER:-}"

      - name: Audit and rename package
        id: deb
        working-directory: AssppJailbroken
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2; exit }' "backend-swift/packaging/control.${{ matrix.variant }}")"
          source_deb="$(find backend-swift/debs -maxdepth 1 -type f -name "wiki.qaq.unfaird_${version}_*.deb" -print | head -n 1)"
          test -f "$source_deb"
          mkdir -p release
          output="release/wiki.qaq.unfaird_${version}_${{ matrix.variant }}_${{ matrix.architecture }}.deb"
          cp "$source_deb" "$output"
          test "$(dpkg-deb -f "$output" Version)" = "$version"
          test "$(dpkg-deb -f "$output" Architecture)" = "${{ matrix.architecture }}"
          dpkg-deb -f "$output" Name Description
          if [[ "${{ matrix.profile }}" == taurine ]]; then
            dpkg-deb --contents "$output" | grep -q 'UnfairRuntimeRunner'
            dpkg-deb --contents "$output" | grep -q 'UnfairRuntimeDumper.dylib'
          fi
          shasum -a 256 "$output" > "${output}.sha256"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "name=unfaird-${{ matrix.variant }}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.deb.outputs.name }}
          path: |
            AssppJailbroken/${{ steps.deb.outputs.path }}
            AssppJailbroken/${{ steps.deb.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish three device debs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: unfaird-*
          path: release
          merge-multiple: true

      - name: Upload unified device release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
