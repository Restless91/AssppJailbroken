services:
  asspp-platform:
    build: .
    container_name: asspp-platform
    restart: unless-stopped
    network_mode: host
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    environment:
      PORT: "8090"
      PLATFORM_CONFIG: /app/config.json
      PLATFORM_DATABASE: /app/data/platform.sqlite
      PLATFORM_MASTER_KEY: replace-with-at-least-32-random-characters
    volumes:
      - ./config.json:/app/config.json:ro
      - /mnt/nvme0n1-4/asspp-platform:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
